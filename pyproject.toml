[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoop-insights"
version = "0.2.0"
description = "Universal CSV Data Analysis Dashboard — upload any CSV and explore, visualize, and clean your data"
requires-python = ">=3.11"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}

dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.14.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
